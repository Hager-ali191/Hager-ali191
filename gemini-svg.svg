<svg width="450" height="150" viewBox="0 0 450 150" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="450" height="150" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
  
  <!-- Header -->
  <text x="25" y="35" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#05D5A1">DataCamp Learning Stats</text>
  <line x1="25" y1="48" x2="425" y2="48" stroke="#21262d" stroke-width="1"/>

  <!-- Stat 1: Total XP -->
  <g transform="translate(30, 70)">
    <text x="0" y="25" font-family="Segoe UI, Helvetica, Arial" font-size="28" font-weight="bold" fill="#58A6FF">45,200</text>
    <text x="0" y="45" font-family="Segoe UI, Helvetica, Arial" font-size="12" fill="#8B949E">Total XP Earned</text>
  </g>

  <!-- Divider 1 -->
  <line x1="160" y1="65" x2="160" y2="125" stroke="#21262d" stroke-width="1"/>

  <!-- Stat 2: Completed Courses -->
  <g transform="translate(180, 70)">
    <text x="0" y="25" font-family="Segoe UI, Helvetica, Arial" font-size="28" font-weight="bold" fill="#3FB950">12</text>
    <text x="0" y="45" font-family="Segoe UI, Helvetica, Arial" font-size="12" fill="#8B949E">Courses Done</text>
  </g>

  <!-- Divider 2 -->
  <line x1="290" y1="65" x2="290" y2="125" stroke="#21262d" stroke-width="1"/>

  <!-- Stat 3: Certificates -->
  <g transform="translate(310, 70)">
    <text x="0" y="25" font-family="Segoe UI, Helvetica, Arial" font-size="28" font-weight="bold" fill="#BC8CFF">4</text>
    <text x="0" y="45" font-family="Segoe UI, Helvetica, Arial" font-size="12" fill="#8B949E">Certificates</text>
  </g>
</svg>
